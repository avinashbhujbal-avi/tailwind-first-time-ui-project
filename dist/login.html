
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center flex-col">
    <div class="w-full flex justify-start">
       <a href="index.html"><img src="backicon.png" alt="" height="30px " width="30px"></a> 
    </div>

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-semibold text-center mb-6">Login</h2>
        
        <form id="loginForm" action="#" method="POST" onsubmit="validateForm(event)">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your email">
                <p id="emailError" class="text-red-500 text-sm mt-1"></p>
            </div>
            
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your password">
                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <div class="flex items-center justify-between mb-6">
                <div>
                    <input type="checkbox" id="remember" name="remember" class="text-blue-500 border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                    <label for="remember" class="text-sm text-gray-700">Remember me</label>
                </div>
                <a href="#" class="text-sm text-blue-500 hover:underline">Forgot password?</a>
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Login
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-gray-600">
            Don't have an account? <a href="#" class="text-blue-500 hover:underline">Sign up</a>
        </p>
    </div>
    <script>
        function validateForm(event) {
            event.preventDefault(); // Prevent form submission

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            let isValid = true;

            // Reset previous error messages
            document.getElementById("emailError").textContent = "";
            document.getElementById("passwordError").textContent = "";

            // Email validation
            if (!email) {
                document.getElementById("emailError").textContent = "Email is required.";
                isValid = false;
            } else if (!/\S+@\S+\.\S+/.test(email)) {
                document.getElementById("emailError").textContent = "Please enter a valid email address.";
                isValid = false;
            }

            // Password validation
            if (!password) {
                document.getElementById("passwordError").textContent = "Password is required.";
                isValid = false;
            } else if (password.length < 6) {
                document.getElementById("passwordError").textContent = "Password must be at least 6 characters.";
                isValid = false;
            }

            // If everything is valid, submit the form
            if (isValid) {
                document.getElementById("loginForm").submit();
            }
        }
    </script>

</body>
</html>
