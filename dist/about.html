<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }
        h1 {
            color: #007BFF;
        }
        p {
            line-height: 1.6;
        }
        .team {
            margin-top: 20px;
        }
        .team img {
            width: 100px;
            border-radius: 50%;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>About Us</h1>
        <p>Welcome to our company. We are dedicated to providing the best services and solutions for our clients. Our team consists of highly skilled professionals passionate about innovation and excellence.</p>
        
        <div class="team">
            <h2>Meet Our Team</h2>
            <img src="https://via.placeholder.com/100" alt="Team Member 1">
            <img src="https://via.placeholder.com/100" alt="Team Member 2">
            <img src="https://via.placeholder.com/100" alt="Team Member 3">
        </div>
    </div>
</body>
</html>
